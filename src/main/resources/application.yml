springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

spring:
  application:
    name: finance-tracker-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_tracker}
    username: ${DB_USER:finance_user}
    password: ${DB_PASS:finance_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "CREATE SCHEMA IF NOT EXISTS dbutils; SET search_path TO ods, ref, rpt, dbutils, public"
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    database-change-log-table: changelog_audit
    database-change-log-lock-table: databasechangeloglock
    liquibase-schema: dbutils

server:
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
    include-message: always

ollama:
  base-url: ${OLLAMA_URL:http://172.17.0.1:11434}
  model: ${OLLAMA_MODEL:gemma4:e2b}
  timeout-seconds: 120

app:
  jwt:
    secret: ${JWT_SECRET:default-secret-change-in-production}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:30}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:2}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:codingforfun496@gmail.com}
    sender-name: ${BREVO_SENDER_NAME:Finance Tracker}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
